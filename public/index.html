<!doctype html><html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8edf1"><title>Linkstudio — visas saites vienuviet</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--ink,#392b36);background:var(--bg,#f8edf1);min-height:100vh;background-image:radial-gradient(ellipse at 10% 0%,var(--glow,#f5cad9),transparent 55%),radial-gradient(ellipse at 100% 90%,var(--glow2,#f9e1c9),transparent 55%)}body[data-theme=lavender]{--bg:#f0ecff;--glow:#d8c8ff;--glow2:#f6d8f0;--ink:#382c58}body[data-theme=dark]{--bg:#16151e;--glow:#302345;--glow2:#223344;--ink:#f7f3ff;--surface:#252331;--border:#454052}body[data-theme=sand]{--bg:#f8f1e5;--glow:#e8d2b7;--glow2:#e1e8d4;--ink:#48382b}a{color:inherit}button,input,textarea,select{font:inherit}button{cursor:pointer} .shell{max-width:560px;margin:auto;padding:32px 22px 40px;min-height:100vh;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:2px;font-weight:800}.tiny{border:1px solid var(--border,#ffffff99);background:var(--surface,#ffffff70);color:inherit;border-radius:100px;padding:10px 15px;text-decoration:none;letter-spacing:0}.profile{text-align:center;padding:56px 0 28px}.avatar{width:104px;height:104px;margin:auto;border-radius:50%;display:grid;place-items:center;font-size:42px;font-family:Georgia,serif;background:linear-gradient(135deg,#d99ab6,#f6d4bd);color:white;border:4px solid #ffffffb0;box-shadow:0 10px 35px #8b526323;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}h1{font-family:Georgia,serif;font-size:42px;letter-spacing:-1.8px;margin:22px 0 8px;font-weight:500;overflow-wrap:anywhere}.bio{line-height:1.6;opacity:.75;white-space:pre-wrap;overflow-wrap:anywhere}.links{display:grid;gap:12px}.link{display:grid;grid-template-columns:42px 1fr 24px;align-items:center;text-decoration:none;background:var(--surface,#ffffffa8);border:1px solid var(--border,#ffffffcc);border-radius:20px;padding:12px;min-height:68px;box-shadow:0 5px 20px #4a284208;transition:transform .2s,box-shadow .2s}.link:hover{transform:translateY(-3px);box-shadow:0 10px 25px #4a28421a}.link span:nth-child(2){text-align:center;font-weight:650;overflow-wrap:anywhere}.glyph{font-size:22px;text-align:center}.arrow{opacity:.45}footer{text-align:center;margin-top:auto;padding-top:50px;opacity:.55;font-size:11px;letter-spacing:2px}.panel{background:var(--surface,#ffffffb5);padding:24px;border:1px solid var(--border,#fff);border-radius:24px;margin-top:20px;box-shadow:0 10px 40px #392b3609}.panel h2{margin:0 0 18px;font-size:20px}.field{display:grid;gap:7px;margin:12px 0;font-size:13px;font-weight:600}input,textarea,select{width:100%;min-width:0;border:1px solid #a68e9d44;background:var(--surface,#fff9);color:inherit;padding:12px;border-radius:12px}textarea{resize:vertical}.primary{border:0;background:#392b36;color:white;padding:14px 20px;border-radius:14px;font-weight:700;width:100%}.secondary{border:1px solid #a68e9d55;background:transparent;color:inherit;padding:9px 12px;border-radius:10px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.editor-link{border:1px solid #a68e9d44;border-radius:16px;padding:13px;margin:12px 0}.editor-link input{margin:4px 0}.msg{font-size:13px;line-height:1.5;margin:12px 0;min-height:18px}.muted{opacity:.65;font-size:13px}.empty{text-align:center;padding:20px;opacity:.6}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.head h2{margin:0}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #bc6998;outline-offset:3px}
</style></head><body><main class="shell" id="app"><div class="empty">Ielādē...</div></main><script type="module">
const app=document.querySelector('#app');let p={name:'Tavs vārds',bio:'Visas manas saites vienuviet ✨',avatar:'',theme:'rose',links:[]};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safe=s=>{try{let u=new URL(s);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}};async function api(method='GET',body,path=''){let r=await fetch('/api/profile'+path,{method,headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});let j=await r.json();if(!r.ok)throw Error(j.error||'Kļūda');return j}const theme=()=>document.body.dataset.theme=p.theme;function landing(){theme();app.innerHTML=`<div class="top"><span>✳ LINKSTUDIO</span><button class="tiny" id="share">↗ Dalīties</button></div><section class="profile"><div class="avatar">${safe(p.avatar)?`<img src="${esc(safe(p.avatar))}" alt="Profila attēls">`:esc(p.name.trim().charAt(0)||'✦')}</div><h1>${esc(p.name)}</h1><div class="bio">${esc(p.bio)}</div></section><div class="links">${p.links.filter(l=>l.enabled!==false&&safe(l.url)).map(l=>`<a class="link" href="${esc(safe(l.url))}" target="_blank" rel="noopener noreferrer"><span class="glyph">${esc(l.icon)}</span><span>${esc(l.title)}</span><span class="arrow">↗</span></a>`).join('')||'<div class="empty">Drīzumā šeit būs saites ✨</div>'}</div><footer>MADE FOR YOU · <a href="/admin">ADMIN</a></footer>`;document.querySelector('#share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:p.name,url:location.origin});else{await navigator.clipboard.writeText(location.origin);document.querySelector('#share').textContent='✓ Nokopēts'}}catch{}}}
function login(){app.innerHTML=`<div class="top"><span>✳ LINKSTUDIO</span><a class="tiny" href="/">Publiskais profils ↗</a></div><section class="panel" style="margin-top:70px"><h1 style="font-size:34px;margin-top:0">Sveika atpakaļ!</h1><p class="muted">Pieslēdzies, lai pārvaldītu savas saites.</p><form id="login"><label class="field">Parole<input type="password" name="password" required autocomplete="current-password"></label><div class="msg" id="msg"></div><button class="primary">Pieslēgties</button></form></section>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();try{await api('POST',{action:'login',password:new FormData(e.target).get('password')});p=await api();editor()}catch(e){document.querySelector('#msg').textContent=e.message}}}
function editor(){theme();app.innerHTML=`<div class="top"><span>✳ STUDIO / ADMIN</span><a class="tiny" href="/" target="_blank">Apskatīt profilu ↗</a></div><h1>Mana lapa.</h1><div class="muted">Tava vieta internetā. Tavi noteikumi.</div><section class="panel"><h2>Profils</h2><label class="field">Vārds<input id="name" maxlength="80" value="${esc(p.name)}"></label><label class="field">Apraksts<textarea id="bio" maxlength="300">${esc(p.bio)}</textarea></label><label class="field">Profila attēla URL<input id="avatar" type="url" value="${esc(p.avatar)}" placeholder="https://..."></label><label class="field">Krāsu tēma<select id="theme">${[['rose','Rose blush'],['lavender','Lavender'],['sand','Warm sand'],['dark','Midnight']].map(([v,t])=>`<option value="${v}" ${p.theme===v?'selected':''}>${t}</option>`).join('')}</select></label></section><section class="panel"><div class="head"><h2>Manas saites</h2><button class="secondary" id="add">+ Pievienot</button></div><div id="items">${p.links.map((l,i)=>`<div class="editor-link" data-i="${i}"><input aria-label="Nosaukums" data-k="title" placeholder="Instagram" value="${esc(l.title)}"><input aria-label="Saite" data-k="url" placeholder="https://..." value="${esc(l.url)}"><div class="toolbar"><input aria-label="Ikona" data-k="icon" style="width:64px" value="${esc(l.icon)}"><button class="secondary" data-action="up" ${i===0?'disabled':''}>↑</button><button class="secondary" data-action="down" ${i===p.links.length-1?'disabled':''}>↓</button><button class="secondary" data-action="toggle">${l.enabled===false?'Paslēpta':'Redzama'}</button><button class="secondary" data-action="delete">Dzēst</button></div></div>`).join('')}</div></section><div class="msg" id="msg"></div><button class="primary" id="save">Saglabāt izmaiņas</button><button class="secondary" id="logout" style="margin-top:15px">Izrakstīties</button>`;for(const k of ['name','bio','avatar','theme'])document.getElementById(k).oninput=e=>{p[k]=e.target.value;theme()};document.querySelector('#items').oninput=e=>{let i=e.target.closest('[data-i]')?.dataset.i;if(i!==undefined&&e.target.dataset.k)p.links[i][e.target.dataset.k]=e.target.value};document.querySelector('#items').onclick=e=>{let a=e.target.dataset.action;if(!a)return;let i=+e.target.closest('[data-i]').dataset.i;if(a==='delete')p.links.splice(i,1);if(a==='toggle')p.links[i].enabled=p.links[i].enabled===false;if(a==='up'&&i>0)[p.links[i-1],p.links[i]]=[p.links[i],p.links[i-1]];if(a==='down'&&i<p.links.length-1)[p.links[i+1],p.links[i]]=[p.links[i],p.links[i+1]];editor()};document.querySelector('#add').onclick=()=>{p.links.push({title:'',url:'',icon:'🔗',enabled:true});editor()};document.querySelector('#save').onclick=async()=>{let msg=document.querySelector('#msg');if(p.links.some(l=>!l.title.trim()||!safe(l.url))){msg.textContent='Katrai saitei ievadi nosaukumu un pilnu https:// adresi.';return}try{p=await api('PUT',p);editor();document.querySelector('#msg').textContent='✓ Izmaiņas saglabātas!'}catch(e){msg.textContent=e.message}};document.querySelector('#logout').onclick=async()=>{await api('POST',{action:'logout'});login()}}
try{if(location.pathname==='/admin'){const s=await api('GET',null,'?session=1');if(s.authorized){p=await api();editor()}else login()}else{p=await api();landing()}}catch(e){app.innerHTML='<div class="panel"><h2>Linkstudio</h2><p>'+esc(e.message)+'</p></div>'}
</script></body></html>
